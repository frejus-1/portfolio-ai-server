<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Assistant IA du portfolio de Fréjus Adjanohoun">

    <title>Assistant IA — Fréjus Adjanohoun</title>

    <link rel="stylesheet" href="/style.css">

    <!-- Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <!-- Protection du HTML généré par Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
</head>

<body>

    <!-- =====================================================
         BOUTON FLOTTANT
    ====================================================== -->

    <button
        type="button"
        class="ai-chatbot-button"
        id="openChatButton"
        aria-label="Ouvrir l'assistant IA"
        title="Ouvrir l'assistant IA"
    >

        <span class="ai-chatbot-button-photo">
            <img
                src="/frejus.png"
                alt="Fréjus"
                onerror="this.style.display='none'"
            >
        </span>

        <span class="ai-chatbot-button-text">
            AI
        </span>

        <span class="ai-chatbot-online-dot"></span>

    </button>


    <!-- =====================================================
         OVERLAY
    ====================================================== -->

    <div
        class="ai-chatbot-overlay"
        id="chatOverlay"
        hidden
    >

        <!-- =================================================
             FENÊTRE
        ================================================== -->

        <div
            class="ai-chatbot-window"
            role="dialog"
            aria-modal="true"
            aria-labelledby="ai-chatbot-title"
        >

            <!-- =============================================
                 HEADER
            ============================================== -->

            <header class="ai-chatbot-header">

                <div class="ai-chatbot-header-info">

                    <div class="ai-chatbot-avatar">

                        <img
                            src="/frejus.png"
                            alt="Fréjus"
                            onerror="this.style.display='none'"
                        >

                    </div>

                    <div>

                        <h2 id="ai-chatbot-title">
                            Assistant IA
                        </h2>

                        <p>

                            <span class="ai-status-dot"></span>

                            <span id="chatSubtitle">
                                Je connais le portfolio de Fréjus
                            </span>

                        </p>

                    </div>

                </div>


                <button
                    type="button"
                    class="ai-chatbot-close"
                    id="closeChatButton"
                    aria-label="Fermer l'assistant IA"
                    title="Fermer l'assistant IA"
                >
                    ×
                </button>

            </header>


            <!-- =============================================
                 MESSAGES
            ============================================== -->

            <div
                class="ai-chatbot-messages"
                id="messagesContainer"
            >

                <!-- Message de bienvenue -->

                <div
                    class="ai-message ai-message-assistant"
                    id="welcomeMessage"
                >

                    <div class="ai-message-avatar">

                        <img
                            src="/frejus.png"
                            alt="Fréjus"
                            onerror="this.style.display='none'"
                        >

                    </div>


                    <div class="ai-message-content">

                        <p>
                            Bonjour, je suis l'assistant IA
                            du portfolio de Fréjus.
                        </p>

                        <p>
                            Que souhaitez-vous savoir sur
                            son parcours, ses compétences
                            ou ses projets ?
                        </p>

                    </div>

                </div>


                <!-- =========================================
                     QUESTIONS RAPIDES
                ========================================== -->

                <div
                    class="ai-quick-questions"
                    id="quickQuestions"
                >

                    <span>
                        Questions rapides
                    </span>

                    <div>

                        <button
                            type="button"
                            data-question="Qui est Fréjus ?"
                        >
                            Qui est Fréjus ?
                        </button>

                        <button
                            type="button"
                            data-question="Quelles technologies utilise-t-il ?"
                        >
                            Quelles technologies utilise-t-il ?
                        </button>

                        <button
                            type="button"
                            data-question="Quels sont ses projets ?"
                        >
                            Quels sont ses projets ?
                        </button>

                        <button
                            type="button"
                            data-question="Comment le contacter ?"
                        >
                            Comment le contacter ?
                        </button>

                    </div>

                </div>


                <!-- Référence utilisée pour le scroll -->

                <div id="messagesEnd"></div>

            </div>


            <!-- =============================================
                 FORMULAIRE
            ============================================== -->

            <form
                class="ai-chatbot-form"
                id="chatForm"
            >

                <textarea
                    id="messageInput"
                    rows="1"
                    maxlength="2000"
                    placeholder="Posez-moi une question..."
                    aria-label="Posez-moi une question..."
                ></textarea>


                <button
                    type="submit"
                    id="sendButton"
                    aria-label="Envoyer"
                    title="Envoyer"
                    disabled
                >

                    <svg
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >

                        <path
                            d="M5 12h13M13 6l6 6-6 6"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        />

                    </svg>

                </button>

            </form>


            <!-- =============================================
                 FOOTER
            ============================================== -->

            <div class="ai-chatbot-footer">
                Powered by Gemini
            </div>

        </div>

    </div>


    <!-- =====================================================

    ====================================================== -->

            return SECRET_PATTERNS.some(

            return text
                .trim()
                .toLowerCase()
                .normalize("NFD")
                .replace(/[\u0300-\u036f]/g, "")
                .replace(/\s+/g, " ");

        }

        /*
        |--------------------------------------------------------------------------
        | Détection de la langue
        |--------------------------------------------------------------------------
        */

        function detectLanguage(text) {

            const normalized =
                normalizeText(text);

            const englishWords = [

                "who",
                "what",
                "which",
                "how",
                "where",
                "when",
                "why",
                "tell",
                "about",
                "skills",
                "technologies",
                "projects",
                "contact"

            ];

            return englishWords.some(
                (word) =>
                    normalized.includes(word)
            )
                ? "en"
                : "fr";

        }


        /*
        |--------------------------------------------------------------------------
        | Réponse locale
        |--------------------------------------------------------------------------
        */

        function getLocalAnswer(message) {

            const language =
                detectLanguage(message);

            const normalized =
                normalizeText(message);

            | Question exacte
            */

            const exactAnswer =
                LOCAL_ANSWERS[language]?.[normalized];

            if (exactAnswer) {

                return exactAnswer;

            }

            */

                "presente moi frejus",
                "presente-moi frejus",
                "tell me about frejus",

            if (

        /*
        |--------------------------------------------------------------------------
        | Ajouter un message
        |--------------------------------------------------------------------------
        */

        function addMessage(role, content) {

            const message =
                document.createElement("div");

            message.className =
                `ai-message ai-message-${role}`;

            message.dataset.id =
                messageId++;


            /*
            | Avatar assistant
            */

            if (role === "assistant") {

                const avatar =
                    document.createElement("div");

                avatar.className =
                    "ai-message-avatar";

                avatar.innerHTML = `
                    <img
                        src="/frejus.png"
                        alt="Fréjus"
                        onerror="this.style.display='none'"
                    >
                `;

                message.appendChild(avatar);

            }


            /*
            | Contenu
            */

            const contentElement =
                document.createElement("div");

            contentElement.className =
                "ai-message-content";


            /*
            | Markdown assistant
            */

            if (role === "assistant") {

                contentElement.innerHTML =
                    renderMarkdown(content);

            } else {

                const paragraph =
                    document.createElement("p");

                paragraph.textContent =
                    content;

                contentElement.appendChild(
                    paragraph
                );

            }


            message.appendChild(
                contentElement
            );


            /*
            | Insérer avant la référence de scroll
            */

            messagesContainer.insertBefore(
                message,
                messagesEnd
            );


            /*
            | Scroll
            */

            scrollToBottom();

        }


        /*
        |--------------------------------------------------------------------------
        | Markdown + liens sociaux
        |--------------------------------------------------------------------------
        */

        function renderMarkdown(markdown) {

            let html = "";


            try {

                html =
                    marked.parse(
                        markdown || ""
                    );

            } catch (error) {

                console.error(
                    "Erreur Markdown :",
                    error
                );

                html =
                    `<p>${escapeHtml(markdown)}</p>`;

            }


            /*
            | Sécurité
            */

            html =
                DOMPurify.sanitize(
                    html,
                    {
                        USE_PROFILES: {
                            html: true
                        }
                    }
                );


            /*
            | Wrapper temporaire
            */

            const wrapper =
                document.createElement("div");

            wrapper.innerHTML =
                html;


            /*
            | Transformer les liens sociaux
            */

            const links =
                wrapper.querySelectorAll("a");


            links.forEach((link) => {

                const href =
                    link.getAttribute("href") || "";


                const social =
                    getSocialLinkInfo(href);


                if (social) {

                    transformSocialLink(
                        link,
                        social
                    );

                } else {

                    link.classList.add(
                        "ai-markdown-link"
                    );

                    link.target =
                        "_blank";

                    link.rel =
                        "noopener noreferrer";

                }

            });


            return wrapper.innerHTML;

        }


        /*
        |--------------------------------------------------------------------------
        | Escape HTML
        |--------------------------------------------------------------------------
        */

        function escapeHtml(text) {

            const div =
                document.createElement("div");

            div.textContent =
                text;

            return div.innerHTML;

        }


        /*
        |--------------------------------------------------------------------------
        | Informations sociales
        |--------------------------------------------------------------------------
        */

        function getSocialLinkInfo(url) {

            if (!url) {

                return null;

            }


            const normalized =
                url.toLowerCase();


            /*
            | GitHub
            */

            if (
                normalized.includes("github.com")
            ) {

                return {

                    platform: "GitHub",

                    type: "github",

                    value: "@frejus-1"

                };

            }


            /*
            | LinkedIn
            */

            if (
                normalized.includes("linkedin.com")
            ) {

                return {

                    platform: "LinkedIn",

                    type: "linkedin",

                    value: "Fréjus Adjanohoun"

                };

            }


            /*
            | Instagram
            */

            if (
                normalized.includes("instagram.com")
            ) {

                return {

                    platform: "Instagram",

                    type: "instagram",

                    value: "@adjanohounf"

                };

            }


            /*
            | Facebook
            */

            if (
                normalized.includes("facebook.com")
            ) {

                return {

                    platform: "Facebook",

                    type: "facebook",

                    value: "Fréjus Adjanohoun"

                };

            }


            /*
            | WhatsApp
            */

            if (
                normalized.includes("wa.me") ||
                normalized.includes("whatsapp.com")
            ) {

                return {

                    platform: "WhatsApp",

                    type: "whatsapp",

                    value: "+229 01 52 90 53 10"

                };

            }


            /*
            | Email
            */

            if (
                normalized.startsWith("mailto:")
            ) {

                return {

                    platform: "Email",

                    type: "email",

                    value: "f2987319@gmail.com"

                };

            }


            return null;

        }


        /*
        |--------------------------------------------------------------------------
        | Transformer lien social
        |--------------------------------------------------------------------------
        */

        function transformSocialLink(
            link,
            social
        ) {

            link.className =
                "ai-social-link";


            link.target =
                social.type === "email"
                    ? "_self"
                    : "_blank";


            if (
                social.type !== "email"
            ) {

                link.rel =
                    "noopener noreferrer";

            }


            /*
            | Carte sociale :
            | icône + plateforme + valeur
            |
            | Pas d'emoji
            | Pas de flèche
            */

            link.innerHTML = `

                <span
                    class="ai-social-icon ai-social-icon-${social.type}"
                    aria-hidden="true"
                >
                    ${getSocialIcon(social.type)}
                </span>

                <span class="ai-social-content">

                    <span class="ai-social-platform">
                        ${escapeHtml(social.platform)}
                    </span>

                    <span class="ai-social-value">
                        ${escapeHtml(social.value)}
                    </span>

                </span>

            `;

        }

                        <path
                            fill="currentColor"
                            d="M20.52 3.48A11.85 11.85 0 0 0 12.09 0C5.54 0 .21 5.32.21 11.88c0 2.09.55 4.13 1.6 5.92L.1 24l6.34-1.66a11.88 11.88 0 0 0 5.65 1.44h.01c6.55 0 11.88-5.33 11.88-11.88 0-3.17-1.24-6.14-3.46-8.42ZM12.1 21.74h-.01a9.84 9.84 0 0 1-5.02-1.37l-.36-.21-3.76.98 1-3.66-.23-.38a9.82 9.82 0 0 1-1.51-5.22c0-5.42 4.42-9.83 9.85-9.83a9.78 9.78 0 0 1 6.97 2.89 9.8 9.8 0 0 1 2.88 6.98c0 5.42-4.42 9.83-9.84 9.83Zm5.4-7.37c-.3-.15-1.76-.87-2.03-.97-.27-.1-.47-.15-.67.15-.2.3-.77.97-.95 1.17-.17.2-.35.22-.65.07-.3-.15-1.26-.46-2.4-1.48-.89-.79-1.49-1.77-1.66-2.07-.17-.3-.02-.46.13-.61.14-.14.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.02-.52-.07-.15-.67-1.62-.92-2.22-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.07-.79.37-.27.3-1.03 1-1.03 2.45s1.06 2.84 1.21 3.04c.15.2 2.09 3.2 5.07 4.49.71.31 1.26.5 1.69.64.71.23 1.35.2 1.86.12.57-.08 1.76-.72 2.01-1.42.25-.7.25-1.3.17-1.42-.07-.12-.27-.2-.57-.35Z"
                        />
                    </svg>
                `;

            }


            /*
            | Email
            */

            if (type === "email") {

                return `
                    <svg
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >
                        <rect
                            x="2"
                            y="4"
                            width="20"
                            height="16"
                            rx="3"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                        />

                        <path
                            d="m3 6 9 7 9-7"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        />
                    </svg>
                `;

            }


            return "";

        }


        /*
        |--------------------------------------------------------------------------
        | Indicateur de chargement
        |--------------------------------------------------------------------------
        */

        function showTyping() {

            const message =
                document.createElement("div");

            message.className =
                "ai-message ai-message-assistant";

            message.id =
                "typingMessage";


            message.innerHTML = `

                <div class="ai-message-avatar">

                    <img
                        src="/frejus.png"
                        alt="Fréjus"
                        onerror="this.style.display='none'"
                    >

                </div>


                <div class="ai-typing-container">

                    <div class="ai-typing">

                        <span></span>
                        <span></span>
                        <span></span>

                    </div>

                    <small>
                        L'assistant réfléchit...
                    </small>

                </div>

            `;


            messagesContainer.insertBefore(
                message,
                messagesEnd
            );


            scrollToBottom();

        }


        /*
        |--------------------------------------------------------------------------
        | Supprimer chargement
        |--------------------------------------------------------------------------
        */

        function hideTyping() {

            const typing =
                document.getElementById(
                    "typingMessage"
                );


            if (typing) {

                typing.remove();

            }

        }


        /*
        |--------------------------------------------------------------------------
        | Scroll
        |--------------------------------------------------------------------------
        */

        function scrollToBottom() {

            requestAnimationFrame(() => {

                messagesEnd.scrollIntoView({
                    behavior: "smooth",
                    block: "end"
                });

            });

        }


        /*
        |--------------------------------------------------------------------------
        | Ouvrir
        |--------------------------------------------------------------------------
        */

        function openChat() {

            chatOverlay.hidden =
                false;

            document.body.style.overflow =
                "hidden";


            setTimeout(() => {

                messageInput.focus();

            }, 150);

        }


        /*
        |--------------------------------------------------------------------------
        | Fermer
        |--------------------------------------------------------------------------
        */

        function closeChat() {

            chatOverlay.hidden =
                true;

            document.body.style.overflow =
                "";

            openChatButton.focus();

        }


        /*
        |--------------------------------------------------------------------------
        | Envoi
        |--------------------------------------------------------------------------
        */

        async function sendMessage(text) {

            const cleanMessage =
                text.trim();


            if (
                !cleanMessage ||
                isLoading
            ) {

                return;

            }


            /*
            | Désactiver
            */

            isLoading =
                true;

            sendButton.disabled =
                true;

            messageInput.value =
                "";

            autoResizeTextarea();


            /*
            | Message utilisateur
            */

            addMessage(
                "user",
                cleanMessage
            );


            /*
            | Protection locale
            */

            if (
                isSecretQuestion(
                    cleanMessage
                )
            ) {

                setTimeout(() => {

                    addMessage(
                        "assistant",
                        SECRET_ERROR
                    );

                    isLoading =
                        false;

                    updateSendButton();

                }, 200);


                return;

            }


            /*
            | Réponse locale rapide
            */

            const localAnswer =
                getLocalAnswer(
                    cleanMessage
                );


            if (localAnswer) {

                setTimeout(() => {

                    addMessage(
                        "assistant",
                        localAnswer
                    );

                    isLoading =
                        false;

                    updateSendButton();

                }, 250);


                return;

            }


            /*
            | Chargement
            */

            showTyping();


            /*
            | API
            */

            try {

                const response =
                    await fetch(
                        API_URL,
                        {

                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify({
                                    message:
                                        cleanMessage
                                })

                        }
                    );


                let data = {};


                try {

                    data =
                        await response.json();

                } catch {

                    data = {};

                }


                /*
                | Erreur quota
                */

                const errorText =
                    `${data?.error || ""} ${data?.details || ""}`
                        .toLowerCase();


                const isQuotaError =
                    response.status === 429 ||
                    errorText.includes("429") ||
                    errorText.includes(
                        "resource_exhausted"
                    ) ||
                    errorText.includes(
                        "quota"
                    );


                if (!response.ok) {

                    if (
                        isQuotaError
                    ) {

                        throw new Error(
                            "QUOTA_EXCEEDED"
                        );

                    }


                    throw new Error(
                        data?.error ||
                        "Erreur serveur"
                    );

                }


                /*
                | Réponse
                */

                addMessage(
                    "assistant",
                    data?.reply ||
                    "Je n'ai pas reçu de réponse."
                );


            } catch (error) {

                console.error(
                    "Erreur chatbot :",
                    error
                );


                let errorMessage =
                    "Désolé, je n'arrive pas à contacter l'assistant pour le moment.";


                if (
                    error?.message ===
                    "QUOTA_EXCEEDED"
                ) {

                    errorMessage =
                        "Le quota de l'assistant IA est temporairement atteint. Les questions générales pourront fonctionner à nouveau lorsque le quota sera disponible.";

                }


                addMessage(
                    "assistant",
                    errorMessage
                );


            } finally {

                hideTyping();

                isLoading =
                    false;

                updateSendButton();

                messageInput.focus();

            }

        }


        /*
        |--------------------------------------------------------------------------
        | Bouton envoyer
        |--------------------------------------------------------------------------
        */

        function updateSendButton() {

            sendButton.disabled =
                !messageInput.value.trim() ||
                isLoading;

        }


        /*
        |--------------------------------------------------------------------------
        | Redimensionnement textarea
        |--------------------------------------------------------------------------
        */

        function autoResizeTextarea() {

            messageInput.style.height =
                "auto";


            messageInput.style.height =
                Math.min(
                    messageInput.scrollHeight,
                    110
                ) + "px";

        }


        /*
        |--------------------------------------------------------------------------
        | Événements
        |--------------------------------------------------------------------------
        */

        openChatButton.addEventListener(
            "click",
            openChat
        );


        closeChatButton.addEventListener(
            "click",
            closeChat
        );


        /*
        | Clic sur l'extérieur
        */

        chatOverlay.addEventListener(
            "mousedown",
            (event) => {

                if (
                    event.target ===
                    chatOverlay
                ) {

                    closeChat();

                }

            }
        );


        /*
        | Escape
        */

        document.addEventListener(
            "keydown",
            (event) => {

                if (
                    event.key === "Escape" &&
                    !chatOverlay.hidden
                ) {

                    closeChat();

                }

            }
        );


        /*
        | Formulaire
        */

        chatForm.addEventListener(
            "submit",
            (event) => {

                event.preventDefault();

                sendMessage(
                    messageInput.value
                );

            }
        );


        /*
        | Saisie
        */

        messageInput.addEventListener(
            "input",
            () => {

                autoResizeTextarea();

                updateSendButton();

            }
        );


        /*
        | Entrée
        */

        messageInput.addEventListener(
            "keydown",
            (event) => {

                if (
                    event.key === "Enter" &&
                    !event.shiftKey
                ) {

                    event.preventDefault();

                    if (
                        !isLoading &&
                        messageInput.value.trim()
                    ) {

                        sendMessage(
                            messageInput.value
                        );

                    }

                }

            }
        );


        /*
        |--------------------------------------------------------------------------
        | Questions rapides
        |--------------------------------------------------------------------------
        */

        quickQuestions.addEventListener(
            "click",
            (event) => {

                const button =
                    event.target.closest(
                        "button[data-question]"
                    );


                if (!button) {

                    return;

                }


                const question =
                    button.dataset.question;


                sendMessage(
                    question
                );

            }
        );


        /*
        |--------------------------------------------------------------------------
        | Initialisation
        |--------------------------------------------------------------------------
        */

        updateSendButton();

    </script>

</body>
